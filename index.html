<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset</title>
  <meta name="description" content="Reset – a short moment to clear your head. Pick a place, write down your thought and let it drift away.">
  <meta name="theme-color" id="theme-color-meta" content="#000000">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-ui="dark" data-phase="setup">

  <canvas id="world" aria-hidden="true"></canvas>
  <div id="veil" aria-hidden="true"></div>
  <div id="scrim" aria-hidden="true"></div>

  <!-- Bar shown during a session -->
  <div id="bar" hidden>
    <div id="progress"><span id="progress-fill"></span></div>
    <div class="bar-actions">
      <button class="icon-btn" id="mute-btn" type="button" data-i18n-label="mute">
        <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
      </button>
      <button class="icon-btn" id="exit-btn" type="button" data-i18n-label="exit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>

  <main id="app">
    <!-- 1 · Setup -->
    <section class="sheet" id="setup">
      <header class="brand">
        <h1 id="brand-title" aria-label="Reset">Reset</h1>
        <p data-i18n="tagline"></p>
      </header>

      <label class="label" for="thought-input" data-i18n="thoughtLabel"></label>
      <div class="field">
        <textarea id="thought-input" rows="2" maxlength="160" data-i18n-ph="thoughtPlaceholder"></textarea>
      </div>

      <div class="label-row">
        <span class="label" data-i18n="placeLabel"></span>
        <span class="place-hint" id="place-hint"></span>
      </div>
      <div class="gallery" id="gallery" role="radiogroup"></div>

      <div class="row">
        <span class="label" data-i18n="durationLabel"></span>
        <div class="segmented" id="duration" role="radiogroup">
          <span class="pill" aria-hidden="true"></span>
          <button type="button" role="radio" data-min="1">1</button>
          <button type="button" role="radio" data-min="2">2</button>
          <button type="button" role="radio" data-min="5">5</button>
          <span class="unit" data-i18n="minutes"></span>
        </div>
      </div>

      <button class="btn primary" id="start-btn" type="button"><span data-i18n="start"></span></button>

      <footer class="setup-foot">
        <button class="chip" id="sound-btn" type="button" aria-pressed="true"></button>
        <div class="lang segmented small" role="group" data-i18n-label="language">
          <span class="pill" aria-hidden="true"></span>
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </footer>
    </section>

    <!-- 2–5 · Session -->
    <section id="session" hidden>
      <div id="arrive" hidden>
        <p class="arrive-eyebrow" id="arrive-eyebrow"></p>
        <h2 class="arrive-name" id="arrive-name"></h2>
        <p class="arrive-line" id="arrive-line"></p>
      </div>
      <div id="thought"></div>
      <div class="stage">
        <div id="reflect" class="step" hidden>
          <p class="count" id="prompt-count"></p>
          <p class="prompt reveal" id="prompt"></p>
        </div>
        <div id="zoom" class="step" hidden>
          <div id="ladder">
            <p id="ladder-label"></p>
            <div class="ladder-track"><span class="ladder-fill" id="ladder-fill"></span><div class="ladder-dots" id="ladder-dots"></div></div>
          </div>
          <div id="breath-ring"><span id="breath-label"></span></div>
          <p class="fact reveal" id="fact"></p>
        </div>
        <div id="release" class="step" hidden>
          <p class="big reveal" id="release-line"></p>
          <p class="soft reveal" id="release-question"></p>
        </div>
      </div>
    </section>

    <!-- 6 · End -->
    <section class="sheet compact" id="done" hidden>
      <div class="done-orb" aria-hidden="true"></div>
      <h2 id="done-title"></h2>
      <p data-i18n="doneSub"></p>
      <div class="done-actions">
        <button class="btn primary" id="again-btn" type="button"><span data-i18n="again"></span></button>
        <button class="btn ghost" id="stay-btn" type="button" data-i18n="stay"></button>
      </div>
    </section>
  </main>

  <p id="stay-hint" data-i18n="stayHint" hidden></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/world.js"></script>

  <!-- Places: one file per place. New place = new file + one line here. -->
  <script src="js/places/cosmos.js"></script>
  <script src="js/places/northern-lights.js"></script>
  <script src="js/places/beach.js"></script>
  <script src="js/places/forest.js"></script>
  <script src="js/places/summit.js"></script>
  <script src="js/places/campfire.js"></script>
  <script src="js/places/underwater.js"></script>
  <script src="js/places/rainy-city.js"></script>
  <script src="js/places/clouds.js"></script>
  <script src="js/places/rainforest.js"></script>
  <script src="js/places/desert.js"></script>
  <script src="js/places/thunderstorm.js"></script>
  <script src="js/places/mountain-stream.js"></script>
  <script src="js/places/summer-night.js"></script>
  <script src="js/places/snowy-forest.js"></script>
  <script src="js/places/cherry-blossom.js"></script>
  <script src="js/places/deep-sea.js"></script>
  <script src="js/places/wheat-field.js"></script>
  <script src="js/places/white-room.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
